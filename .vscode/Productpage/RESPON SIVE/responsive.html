<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="responsive-mobileview.css">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>responsive-view</title>
</head>
<body>
  <header>
      <div class="header-mobile-main-view">

        <div class="left-mobile-view">
          <a href="" class="black-arrow-anchor">
            <img
              class="black-arrow-image"
              src="flipkartimage/blackarrowleft.svg"
            />
          </a>
          <a href="" class="flip-round-logo">
            <img
              class="flip-roundlogo-image"
              src="flipkartimage/flipmobilelogo.png"
            />
          </a>
        </div>
      

      <div class="middle-mobile-view">
        <span class="input-middle-division">
          mobiles
        </span>
      </div>

      <div class="right-mobile-view">
        <a href="" class="search-mobile-view">
          <img
            class="searchlogo-mobile-view"
            src="flipkartimage/search black.svg"
          />
        </a>
        <div class="cart-division">
          <a href="" class="bascket-mobile-view">
            <img class="bascket-mobile-image" src="flipkartimage/bascket.svg" />
          </a>
        </div>

          <div class="login-division">
            <span class="login-text">Login</span>
          </div>
      </div>

    </div>
    </header>
      <div class="flip">
                <div class="header-one">
                    <div class="left-section"></div>
                  <div class="flipkart-division">
                        <div class="flip-logo-division">
                          <div class="flip-logo-two">
                            <a class="flip-anchor">
                            <img width="75" class="flipkart-logo" src="largescreenimg/flipkartwhite.png"
                            alt="flipkart" title="flipkart" />
                            </a>
                            <a href="" class="anchor-explore">Explore
                              <span class="span-plus">Plus</span>
                              <img width="10" src="largescreenimg/golden-plus.png" class="golden-image"/>
                            </a>
                          </div>
                        </div>
                        
                      <div class="input-bar">
                        <input class="input" type="text" placeholder="Search for Products,Brands and more" />
                        <div class="search-division">
                          <button class="search-button">
                            <div class="search-section">
                        <svg width="20" height="20" viewBox="0 0 17 18" class="" xmlns="http://www.w3.org/2000/svg">
                        <g fill="#2874F1"   fill-rule="evenodd">
                          <path d="m11.618 9.897l4.225 4.212c.092.092.101.232.02.313l-1.465 1.46c-.081.081-.221.072-.314-.02l-4.216-4.203"></path>

                          <path class="EwE-Fa" d="m6.486 10.901c-2.42 0-4.381-1.956-4.381-4.368 0-2.413 1.961-4.369 4.381-4.369 2.42 0 4.381 1.956 4.381 4.369 0 2.413-1.961 4.368-4.381 4.368m0-10.835c-3.582 0-6.486 2.895-6.486 6.467 0 3.572 2.904 6.467 6.486 6.467 3.582 0 6.486-2.895 6.486-6.467 0-3.572-2.904-6.467-6.486-6.467" fill="#2874F0"></path>
                        </g>
                        </svg>
                            </div>
                          </button>
                        </div>
                      </div>

                        <div class="more-division">
                          <div class="login-division">
                            <div class="login-division-one">
                              <div class="drop-downcontent" id="js-drop-downcontent"></div>
                              <a href="" class="anchor-login">
                                login
                              </a>
                            </div>
                          </div>
                        </div>

                        <div class="more-division">
                          <a class="anchor-sell">
                            <span class="seller-text">Become a Seller</span>
                          </a>
                        </div>
                            
                        <div class="more-division">
                          <div class="more-division-two">
                            <div class="more-text">More</div>
                          <svg width="4.7" height="8" viewBox="0 0 16 27" xmlns="http://www.w3.org/2000/svg" class="Wto0b0"><path d="M16 23.207L6.11 13.161 16 3.093 12.955 0 0 13.161l12.955 13.161z" fill="#fff" class="-dC5Le"></path></svg><path></svg>
                          </div>
                        </div> 
                        

                        <div class="more-division">
                          <div class="more-division-two">
                            <a href="" class="anchor-sell">
                              <svg class="GAbRIN" width="16" height="16" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg"><path class="cziJ98" d="M15.32 2.405H4.887C3 2.405 2.46.805 2.46.805L2.257.21C2.208.085 2.083 0 1.946 0H.336C.1 0-.064.24.024.46l.644 1.945L3.11 9.767c.047.137.175.23.32.23h8.418l-.493 1.958H3.768l.002.003c-.017 0-.033-.003-.05-.003-1.06 0-1.92.86-1.92 1.92s.86 1.92 1.92 1.92c.99 0 1.805-.75 1.91-1.712l5.55.076c.12.922.91 1.636 1.867 1.636 1.04 0 1.885-.844 1.885-1.885 0-.866-.584-1.593-1.38-1.814l2.423-8.832c.12-.433-.206-.86-.655-.86" fill="#fff"></path></svg>
                              <div class="cart-text">Cart</div>
                            </a>
                          </div>
                        </div>
                        

                  </div>  
                </div>

                  <div class="left-section"></div>
              </div>  


  
</body>
</html>
