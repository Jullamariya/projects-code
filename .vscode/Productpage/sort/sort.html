<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="sort.css">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sort</title>
</head>
<body>

     

            <div id="sort-panel" class="sort-toggler">

              <div class="sort-division-two">SORT BY</div>
                <div class="sort-division-three"></div> 

                <div class="sort-division-section">

                  <div class="sort-division-four">
                    <div class="sort-division-five">
                      <div class="sort-division-relevance">
                        Relevance
                      </div>
                    </div>
                    <div class="sort-division-six">
                    <label class="custom-radio"><input type="radio" name="option" value="1">
                    <span class="radio-btn"></span></label>
                    </div>
                  </div>

                  <div class="sort-division-four">
                    <div class="sort-division-five">
                      <div class="sort-division-relevance">
                      Porpularity
                      </div>
                    </div>
                    <div class="sort-division-six">
                      <label class="custom-radio"><input type="radio" name="option" value="2">
                      <span class="radio-btn"></span> </label>
                    </div>
                  </div>

                  <div class="sort-division-four">
                    <div class="sort-division-five">
                      <div class="sort-division-relevance">
                      Price -- Low to High
                      </div>
                    </div>
                    <div class="sort-division-six">
                      <label class="custom-radio"><input type="radio" name="option" value="3">
                      <span class="radio-btn"></span> </label>
                    </div>
                  </div>

                  <div class="sort-division-four">
                    <div class="sort-division-five">
                      <div class="sort-division-relevance">
                        Price -- High to Low
                      </div>
                    </div>
                      <div class="sort-division-six">
                        <label class="custom-radio"><input type="radio" name="option" value="4">
                        <span class="radio-btn"></span> </label>
                    </div>
                  </div>

                  <div class="sort-division-four">
                    <div class="sort-division-five">
                      <div class="sort-division-relevance">
                        Newest First
                      </div>
                    </div>
                    <div class="sort-division-six">
                      <label class="custom-radio"><input type="radio" name="option" value="5"> 
                      <span class="radio-btn"></span></label>
                    </div>
                  </div>
                </div>
            </div> 
      

    
   
<button onclick="toggler()">Show List</button>

  <div class="bottom-list" id="bottomList">
    <ul>
      <li>🍎 Apple</li>
      <li>🍌 Banana</li>
      <li>🍇 Grapes</li>
      <li>🍊 Orange</li>
    </ul>
  </div>
